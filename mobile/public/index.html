<!DOCTYPE html>
<!--
  The page the web build is served inside.

  This file exists because of what the app looked like in its first
  second. There was no web manifest, so a phone that had added the app
  to its home screen fell back to the 64-pixel favicon, stretched it to
  two hundred and something, and showed that — a blurred logo on a
  white card — for as long as the bundle took to download.

  Four things fix it, and none of them is a bigger picture:

    1. A manifest with real 192 and 512 icons, and a maskable one, so
       nothing is ever scaled up from 64 pixels again.
    2. The background set on html and body, so the very first paint,
       before a line of JavaScript has run, is already the brand cream
       rather than a white flash.
    3. The name, in the raised lettering the business uses, inside the
       root element. React replaces it the moment it mounts. It is a
       520-pixel image drawn at 260, so it is a 2x asset and cannot go
       soft the way the old 64-pixel favicon did — that was the whole
       complaint, and the fix is the right resolution rather than a
       bigger file.
    4. A theme colour, so the browser chrome matches instead of sitting
       white above a cream page.

  The typeface here is the system one on purpose: the app's font has not
  loaded at this point, and waiting for it would put the blank screen
  back.

  Expo uses this as the template and injects the bundle script itself,
  which is why there is no <script> tag to maintain.
-->
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app run edge to edge on phones with a
         notch; the safe-area insets below keep content out from under it.
         Zoom is left on: pinching is how some people read. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Afya Nyumbani</title>

    <meta name="description" content="Huduma bora ya afya, ukiwa nyumbani kwako." />
    <!-- Replaced at runtime with the chosen theme's colour (app/_layout.js);
         this is only the colour of the first paint. -->
    <meta name="theme-color" content="#C2410C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Afya Nyumbani" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="196x196" href="/favicon-196.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style id="expo-reset">
      /* Expo's own reset: full height, and no body scrolling behind a
         <ScrollView>. The background is the addition. */
      html,
      body {
        height: 100%;
        background-color: #efe8e0;
      }
      body {
        overflow: hidden;
        margin: 0;
        /* Behave like an app on a phone, not a web page: no grey flash
           on every tap, no page bounce or pull-to-refresh behind the
           screens, and no browser enlarging text on its own. */
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }
      /* iOS zooms the whole page into any field whose text is smaller
         than 16px, and does not zoom back out. 16px stops it. */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      #afya-splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #afya-splash img {
        width: 260px;
        max-width: 72vw;
        height: auto;
        display: block;
      }
      #afya-splash .tag {
        font-size: 13px;
        color: #76685f;
      }
      #afya-splash .bar {
        width: 92px;
        height: 3px;
        border-radius: 2px;
        background: rgba(194, 65, 12, 0.18);
        overflow: hidden;
      }
      #afya-splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #c2410c;
        animation: afya-slide 1.1s ease-in-out infinite;
      }
      @keyframes afya-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>

  <body>
    <noscript>Washa JavaScript ili kutumia app hii.</noscript>

    <div id="root">
      <div id="afya-splash">
        <img src="/wordmark-3d.png" alt="Afya Nyumbani" width="520" height="79" />
        <div class="tag">Huduma ya afya mlangoni kwako</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>
